<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tool Hub</title>
    <style>
      :root {
        color-scheme: light;
        --page-bg: #f4f1e8;
        --ink: #171713;
        --muted: #6b665a;
        --panel: #fffdf5;
        --line: #24231d;
        --rule: rgba(36, 35, 29, 0.18);
        --accent: #ff5a3c;
        --accent-dark: #d83c24;
        --signal: #c9ff46;
        --shadow: 10px 10px 0 #171713;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        background:
          linear-gradient(90deg, rgba(23, 23, 19, 0.045) 1px, transparent 1px),
          linear-gradient(rgba(23, 23, 19, 0.045) 1px, transparent 1px),
          radial-gradient(circle at 82% 18%, rgba(201, 255, 70, 0.72), transparent 24rem),
          var(--page-bg);
        background-size: 44px 44px, 44px 44px, auto, auto;
        color: var(--ink);
        font-family: "Aptos", "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      a {
        color: inherit;
      }

      .page {
        width: min(100% - 32px, 1120px);
        margin: 0 auto;
        padding: 34px 0;
      }

      .layout {
        display: grid;
        grid-template-columns: 210px minmax(0, 1fr);
        gap: 28px;
        min-height: calc(100vh - 68px);
      }

      .index-rail {
        position: sticky;
        top: 34px;
        display: flex;
        height: calc(100vh - 68px);
        min-height: 520px;
        flex-direction: column;
        justify-content: space-between;
        border: 2px solid var(--line);
        border-radius: 8px;
        background: var(--signal);
        padding: 18px;
        box-shadow: 6px 6px 0 var(--line);
      }

      .rail-mark {
        font-family: "Bahnschrift Condensed", "Bahnschrift", sans-serif;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        writing-mode: vertical-rl;
      }

      .rail-count {
        display: grid;
        gap: 4px;
      }

      .rail-number {
        font-family: "Cascadia Mono", "Consolas", monospace;
        font-size: 3rem;
        font-weight: 700;
        line-height: 1;
      }

      .rail-label {
        color: rgba(23, 23, 19, 0.72);
        font-size: 0.82rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      .content {
        display: flex;
        min-width: 0;
        flex-direction: column;
        justify-content: space-between;
        gap: 28px;
      }

      .site-header {
        display: grid;
        gap: 18px;
        padding: 26px 0 10px;
        border-bottom: 2px solid var(--line);
      }

      .site-kicker {
        width: max-content;
        max-width: 100%;
        padding: 6px 10px;
        border: 2px solid var(--line);
        border-radius: 999px;
        background: var(--panel);
        font-family: "Cascadia Mono", "Consolas", monospace;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0;
      }

      .site-title {
        margin: 0;
        max-width: 820px;
        font-family: "Bahnschrift Condensed", "Bahnschrift", sans-serif;
        font-size: 7.5rem;
        font-stretch: condensed;
        font-weight: 800;
        letter-spacing: 0;
        line-height: 0.86;
        text-transform: uppercase;
      }

      .site-description {
        margin: 0;
        max-width: 600px;
        color: var(--muted);
        font-size: 1.2rem;
      }

      .tool-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 18px;
      }

      .tool-card {
        position: relative;
        display: flex;
        min-height: 250px;
        flex-direction: column;
        gap: 18px;
        overflow: hidden;
        border: 2px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 20px;
        box-shadow: var(--shadow);
        transform: translate(0, 0);
        transition:
          box-shadow 180ms ease,
          transform 180ms ease,
          background-color 180ms ease;
        animation: card-in 520ms ease both;
      }

      .tool-card:nth-child(2) {
        animation-delay: 90ms;
      }

      .tool-card::before {
        position: absolute;
        inset: 0 0 auto;
        height: 8px;
        background:
          repeating-linear-gradient(
            90deg,
            var(--line) 0,
            var(--line) 16px,
            var(--accent) 16px,
            var(--accent) 32px,
            var(--signal) 32px,
            var(--signal) 48px
          );
        content: "";
      }

      .tool-card:hover {
        background: #fff8df;
        box-shadow: 5px 5px 0 var(--line);
        transform: translate(5px, 5px);
      }

      .tool-meta {
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding-top: 10px;
      }

      .tool-category {
        align-self: flex-start;
        padding: 5px 9px;
        border: 2px solid var(--line);
        border-radius: 999px;
        background: var(--signal);
        font-family: "Cascadia Mono", "Consolas", monospace;
        font-size: 0.75rem;
        font-weight: 700;
        line-height: 1.25;
      }

      .tool-title {
        margin: 0;
        font-family: "Bahnschrift Condensed", "Bahnschrift", sans-serif;
        font-size: 2.55rem;
        font-stretch: condensed;
        font-weight: 800;
        letter-spacing: 0;
        line-height: 0.96;
        text-transform: uppercase;
      }

      .tool-description {
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
      }

      .tool-action {
        display: inline-flex;
        align-items: center;
        justify-content: space-between;
        min-height: 46px;
        margin-top: auto;
        padding: 10px 12px 10px 14px;
        border: 2px solid var(--line);
        border-radius: 8px;
        background: var(--accent);
        color: #ffffff;
        font-family: "Cascadia Mono", "Consolas", monospace;
        font-size: 0.92rem;
        font-weight: 700;
        text-decoration: none;
        transition:
          background-color 160ms ease,
          color 160ms ease;
      }

      .tool-action::after {
        display: inline-grid;
        width: 28px;
        height: 28px;
        margin-left: 12px;
        place-items: center;
        border: 2px solid currentColor;
        border-radius: 50%;
        content: ">";
        line-height: 1;
      }

      .tool-action:hover,
      .tool-action:focus-visible {
        background: var(--accent-dark);
      }

      .tool-action:focus-visible {
        outline: 4px solid rgba(255, 90, 60, 0.28);
        outline-offset: 4px;
      }

      .site-footer {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding-top: 18px;
        border-top: 2px solid var(--line);
        color: var(--muted);
        font-family: "Cascadia Mono", "Consolas", monospace;
        font-size: 0.82rem;
      }

      @keyframes card-in {
        from {
          opacity: 0;
          transform: translateY(18px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 760px) {
        .page {
          width: min(100% - 24px, 1120px);
          padding: 18px 0 24px;
        }

        .layout {
          display: flex;
          min-height: auto;
          flex-direction: column;
          gap: 18px;
        }

        .index-rail {
          position: static;
          height: auto;
          min-height: 0;
          flex-direction: row;
          align-items: center;
        }

        .rail-mark {
          writing-mode: horizontal-tb;
        }

        .rail-count {
          justify-items: end;
        }

        .rail-number {
          font-size: 2rem;
        }

        .site-header {
          padding-top: 14px;
        }

        .site-title {
          font-size: 4.2rem;
        }

        .site-description {
          font-size: 1.05rem;
        }

        .tool-grid {
          grid-template-columns: 1fr;
        }

        .tool-title {
          font-size: 2.1rem;
        }

        .tool-card {
          min-height: 224px;
          box-shadow: 6px 6px 0 var(--line);
        }

        .site-footer {
          flex-direction: column;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 1ms !important;
          scroll-behavior: auto !important;
          transition-duration: 1ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="layout">
        <aside class="index-rail" aria-label="Tool index summary">
          <div class="rail-mark">Static Index</div>
          <div class="rail-count">
            <span class="rail-number" id="tool-count">00</span>
            <span class="rail-label">Tools</span>
          </div>
        </aside>

        <div class="content">
          <header class="site-header" aria-labelledby="site-title">
            <div class="site-kicker">GitHub Pages launcher</div>
            <h1 class="site-title" id="site-title">Tool Hub</h1>
            <p class="site-description">Static tools collection</p>
          </header>

          <section aria-label="Available tools">
            <div class="tool-grid" id="tool-grid"></div>
          </section>

          <footer class="site-footer">
            <span>Static page</span>
            <span>No sign-in required</span>
          </footer>
        </div>
      </div>
    </main>

    <script>
      const tools = [
        {
          title: "Stock Tracker",
          description: "Track stock data from a static dashboard.",
          category: "Finance",
          url: "https://defint91.github.io/Stocktracker/"
        },
        {
          title: "Task Dashboard",
          description: "Open the static task dashboard.",
          category: "Productivity",
          url: "https://anibissama.github.io/Anibis-Dashboard/"
        },
        {
          title: "Trade Records",
          description: "Review trade records from a static page.",
          category: "Trading",
          url: "https://defint91.github.io/Trade_records/"
        }
      ];

      const toolGrid = document.querySelector("#tool-grid");
      const toolCount = document.querySelector("#tool-count");

      toolCount.textContent = String(tools.length).padStart(2, "0");

      tools.forEach((tool) => {
        const card = document.createElement("article");
        card.className = "tool-card";

        const meta = document.createElement("div");
        meta.className = "tool-meta";

        const category = document.createElement("span");
        category.className = "tool-category";
        category.textContent = tool.category;

        const title = document.createElement("h2");
        title.className = "tool-title";
        title.textContent = tool.title;

        const description = document.createElement("p");
        description.className = "tool-description";
        description.textContent = tool.description;

        const action = document.createElement("a");
        action.className = "tool-action";
        action.href = tool.url;
        action.target = "_blank";
        action.rel = "noopener noreferrer";
        action.textContent = "Open";

        meta.append(category, title, description);
        card.append(meta, action);
        toolGrid.append(card);
      });
    </script>
  </body>
</html>
